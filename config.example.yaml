# Copy to config.yaml locally and provide secrets through your deployment
# secret manager or environment-aware configuration.
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "all"
  stdout: true

observability:
  enabled: true
  service_name: "superbizagent"
  otlp_endpoint: "localhost:4317"
  insecure: true
  sample_ratio: 1.0
  debug_content: false

ds_think_chat_model:
  api_key: "${SUPERBIZ_THINK_MODEL_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

ds_quick_chat_model:
  api_key: "${SUPERBIZ_QUICK_MODEL_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-2-251201"

doubao_embedding_model:
  api_key: "${SUPERBIZ_EMBEDDING_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "text-embedding-v4"

file_dir: "./internal/ai/cmd/knowledge_cmd/docs"
mcp_url: "http://localhost:3100/sse"

conversation:
  backend: "memory" # memory or postgres
  max_messages: 20
  postgres:
    dsn: "${SUPERBIZ_CONVERSATION_POSTGRES_DSN}"
